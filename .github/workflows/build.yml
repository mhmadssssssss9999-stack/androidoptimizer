name: Check and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check project
        run: |
          echo "=== PROJECT ==="
          pwd
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== GRADLE WRAPPER ==="
          ls -la gradlew
          file gradlew

      - name: Check environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_OPTS=${JAVA_OPTS:-<empty>}"
          echo "GRADLE_OPTS=${GRADLE_OPTS:-<empty>}"
          unset JAVA_OPTS
          unset GRADLE_OPTS

      - name: Test Gradle
        run: |
          chmod +x gradlew
          unset JAVA_OPTS
          unset GRADLE_OPTS
          ./gradlew --version --no-daemon

      - name: Test project configuration
        run: |
          unset JAVA_OPTS
          unset GRADLE_OPTS
          ./gradlew tasks --no-daemon --stacktrace

      - name: Build APK
        run: |
          unset JAVA_OPTS
          unset GRADLE_OPTS
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK FOUND:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androidoptimizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
